name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run check:shared-sync

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The scripts only use Node built-ins, so no npm ci is needed here.
      - run: npm run test:functions
      - run: npm run check:functions

  database:
    name: Database (migrations, pgTAP, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency in package.json.
          version: 2.119.0
      # Only Postgres, auth, storage and the API gateway are needed for migrations and pgTAP.
      - name: Start Supabase
        run: >-
          supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,supavisor
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --level warning --fail-on error
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  expo:
    name: Expo bundle (android export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export android bundle
        working-directory: app
        env:
          # Dummy values: the bundle only needs them to exist.
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
        run: npx expo export --platform android --output-dir /tmp/expo-export

  # Runs the app in Expo Go on an Android emulator against a local Supabase stack, driven by
  # Maestro flows in app/.maestro. This is the closest CI gets to the manual Expo Go QA pass.
  # When the ANTHROPIC_API_KEY secret is set, it also serves the analyze-meal Edge Function and runs
  # a real photo analysis against Claude (analyze-photo.yaml). Without the secret (e.g. PRs from
  # forks) that flow is skipped.
  e2e:
    name: Expo Go e2e (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_AI_E2E: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Hardware acceleration: the emulator is unusably slow without KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      # Postgres, auth, storage and the gateway, plus Mailpit (local_smtp) so the test can read the
      # emailed sign-in code.
      - name: Start Supabase
        run: >-
          supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - name: Export Supabase env for the app
        run: |
          ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          test -n "$ANON_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # The emulator reaches the host through `adb reverse`, so localhost works for it too.
          echo "EXPO_PUBLIC_SUPABASE_URL=http://localhost:54321" >> "$GITHUB_ENV"

      # Only for the real AI flow. The key goes into the function's env file, never into the app.
      - name: Serve the analyze-meal Edge Function
        if: env.RUN_AI_E2E == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          {
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "ANALYZE_EFFORT=low"
          } > "$RUNNER_TEMP/functions.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          # Ready once the gateway reaches the function (CORS preflight answers 200).
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://localhost:54321/functions/v1/analyze-meal || true)
            test "$code" = 200 && exit 0
            sleep 2
          done
          echo "analyze-meal did not come up (last status: $code)"
          cat "$RUNNER_TEMP/functions.log"
          exit 1

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Expo Go for the app's SDK
        run: |
          SDK=$(cd app && node -p "require('expo/package.json').version.split('.')[0] + '.0.0'")
          URL=$(curl -fsSL https://api.expo.dev/v2/versions/latest \
            | jq -r --arg sdk "$SDK" '.data.sdkVersions[$sdk].androidClientUrl')
          test -n "$URL" && test "$URL" != null
          echo "Expo Go for SDK $SDK: $URL"
          curl -fsSL -o "$RUNNER_TEMP/expo-go.apk" "$URL"

      - name: Start Metro
        working-directory: app
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          # Production bundle: dev-only LogBox warning toasts otherwise cover the tab bar and swallow taps.
          nohup npx expo start --no-dev --minify --port 8081 --offline > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/status | grep -q running && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      - name: Run Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            # A slow CI emulator makes system apps ANR; the dialog then covers Expo Go and blocks Maestro.
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$RUNNER_TEMP/expo-go.apk"
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:54321 tcp:54321
            # The runner executes each line as its own `sh -c`, so no `\` continuations here.
            cd app && (maestro test .maestro/sign-in-and-use.yaml --env EMAIL=e2e-${{ github.run_id }}@example.com --env MAILPIT_URL=http://localhost:54324 --env EXPO_URL=exp://localhost:8081 --format junit --output "$RUNNER_TEMP/maestro-report.xml" --debug-output "$RUNNER_TEMP/maestro-debug"; echo $? > "$RUNNER_TEMP/maestro-exit")
            # On failure, show which step failed, what was on screen and what the logs say, before the emulator goes away.
            if [ "$(cat "$RUNNER_TEMP/maestro-exit")" != 0 ]; then bash .github/scripts/e2e-diagnostics.sh "$RUNNER_TEMP/maestro-debug" "$RUNNER_TEMP/final-screen.png"; fi
            # Real photo analysis against Claude, only when the ANTHROPIC_API_KEY secret is set.
            if [ "$RUN_AI_E2E" = true ]; then cd app && (maestro test .maestro/analyze-photo.yaml --env EMAIL=e2e-ai-${{ github.run_id }}@example.com --env MAILPIT_URL=http://localhost:54324 --env EXPO_URL=exp://localhost:8081 --format junit --output "$RUNNER_TEMP/maestro-ai-report.xml" --debug-output "$RUNNER_TEMP/maestro-ai-debug"; echo $? > "$RUNNER_TEMP/maestro-ai-exit"); else echo "ANTHROPIC_API_KEY is not set; skipping analyze-photo.yaml"; echo 0 > "$RUNNER_TEMP/maestro-ai-exit"; fi
            if [ "$(cat "$RUNNER_TEMP/maestro-ai-exit")" != 0 ]; then bash .github/scripts/e2e-diagnostics.sh "$RUNNER_TEMP/maestro-ai-debug" "$RUNNER_TEMP/final-screen-ai.png"; fi
            test "$(cat "$RUNNER_TEMP/maestro-exit")" = 0 && test "$(cat "$RUNNER_TEMP/maestro-ai-exit")" = 0

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/final-screen.png
            ${{ runner.temp }}/maestro-ai-report.xml
            ${{ runner.temp }}/maestro-ai-debug
            ${{ runner.temp }}/final-screen-ai.png
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/functions.log
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
