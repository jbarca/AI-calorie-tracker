# Drives the app inside Expo Go: sign in with the emailed code, change the daily goal, move
# between tabs, relaunch to check the session persists, then sign out.
# Run by .github/workflows/ci.yml (job "Expo Go e2e"). Env: EMAIL, MAILPIT_URL, EXPO_URL.
appId: host.exp.exponent
---
# --- Sign in with the emailed 6-digit code ---------------------------------------------------
- runFlow: subflows/sign-in.yaml

# --- Today (empty state for a new user) ------------------------------------------------------
- assertVisible: 'Describe a meal'

# --- Settings: change the daily goal ---------------------------------------------------------
- tapOn: 'Settings'
- assertVisible: ${EMAIL}
- tapOn: 'Daily calorie goal in kcal'
- eraseText: 10
- inputText: '2400'
- hideKeyboard
- tapOn: 'Save goal'
- tapOn: 'Today'
- assertVisible: '2400'

# --- Other tabs render -----------------------------------------------------------------------
- tapOn: 'History'
- assertVisible: 'History'
- tapOn: 'Scan'
- assertVisible: 'Scan'

# --- Session survives a relaunch -------------------------------------------------------------
- killApp
- launchApp
- openLink: ${EXPO_URL}
# If Expo Go stays on its home screen, open the project from Recent history.
- extendedWaitUntil:
    visible: 'Scan a meal|Recent history'
    timeout: 120000
- runFlow:
    when:
      visible: 'Recent history'
    commands:
      - tapOn: 'AI Calorie Tracker'
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 120000
- tapOn: 'Settings'
- assertVisible: ${EMAIL}

# --- Sign out --------------------------------------------------------------------------------
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a sign-in link'
    timeout: 30000
