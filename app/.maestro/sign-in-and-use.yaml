# Drives the app inside Expo Go: sign in with the emailed code, change the daily goal, move
# between tabs, relaunch to check the session persists, then sign out.
# Run by .github/workflows/ci.yml (job "Expo Go e2e"). Env: EMAIL, MAILPIT_URL, EXPO_URL.
appId: host.exp.exponent
# Always leave a final screenshot (SHOT_DIR is uploaded by CI) so a failure shows what was on screen.
onFlowComplete:
  - takeScreenshot: ${SHOT_DIR}/final-screen
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}
# First load bundles with Metro, which is slow on a cold CI runner. The app title also shows on
# Expo Go's loading screen, so wait for the sign-in field itself (by label or placeholder).
- extendedWaitUntil:
    visible: 'Email address|you@example\.com'
    timeout: 300000

# --- Sign in with the emailed 6-digit code ---------------------------------------------------
- tapOn: 'Email address|you@example\.com'
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: 'Email me a sign-in link'
- extendedWaitUntil:
    visible: '6-digit code'
    timeout: 30000
- runScript:
    file: scripts/get-code.js
    env:
      EMAIL: ${EMAIL}
      MAILPIT_URL: ${MAILPIT_URL}
- tapOn: '6-digit code'
- inputText: ${output.code}
- hideKeyboard
- tapOn: 'Verify code'

# --- Today (empty state for a new user) ------------------------------------------------------
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 30000
- assertVisible: 'Describe a meal'

# --- Settings: change the daily goal ---------------------------------------------------------
- tapOn: 'Settings'
- assertVisible: ${EMAIL}
- tapOn: 'Daily calorie goal in kcal'
- eraseText: 10
- inputText: '2400'
- hideKeyboard
- tapOn: 'Save goal'
- tapOn: 'Today'
- assertVisible: '2400'

# --- Other tabs render -----------------------------------------------------------------------
- tapOn: 'History'
- assertVisible: 'History'
- tapOn: 'Scan'
- assertVisible: 'Scan'

# --- Session survives a relaunch -------------------------------------------------------------
- killApp
- launchApp
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 120000
- tapOn: 'Settings'
- assertVisible: ${EMAIL}

# --- Sign out --------------------------------------------------------------------------------
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a sign-in link'
    timeout: 30000
