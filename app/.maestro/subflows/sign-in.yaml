# Opens the app in Expo Go from a clean state and signs in with the emailed 6-digit code, ending
# on the Today tab. Shared by the flows in app/.maestro. Env: EMAIL, MAILPIT_URL, EXPO_URL.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${EXPO_URL}
# First load bundles with Metro, which is slow on a cold CI runner. Expo Go also shows a one-time
# "developer menu" onboarding sheet over the app (it repeats the app title), and tapping Continue
# opens the full menu. So wait for either that sheet or the sign-in field, dismiss the sheet and
# the menu if they are there, then wait for the field itself.
- extendedWaitUntil:
    visible: 'Continue|Email address|you@example\.com'
    timeout: 300000
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- extendedWaitUntil:
    visible: 'Email address|you@example\.com'
    timeout: 120000

- tapOn: 'Email address|you@example\.com'
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: 'Email me a sign-in link'
- extendedWaitUntil:
    visible: '6-digit code'
    timeout: 30000
- runScript:
    file: ../scripts/get-code.js
    env:
      EMAIL: ${EMAIL}
      MAILPIT_URL: ${MAILPIT_URL}
- tapOn: '6-digit code'
- inputText: ${output.code}
- hideKeyboard
- tapOn: 'Verify code'
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 30000
